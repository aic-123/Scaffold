#
# 本文件守的正是 README 里那句核心声称：
#   「干净目录退出码 0，规则靶子目录退出码 1」
# 这句话若没有机器在守，就只是一句文档。

name: validator

on:
  push:
  pull_request:
  # 手动触发：给 Actions 页一个 "Run workflow" 按钮。
  # 用途：改仓库设置、改可见性这类操作不会触发 push，但你可能想立刻验证 CI 是不是绿的，
  # 不必为此专门造一个空提交。
  workflow_dispatch:

jobs:
  validator:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # matrix 守的是 README 里"Python 3.9+"这句声称：下限与上限各测一端。
      # 下限另有本地实测依据：Python 3.8.10 可完整跑通四条命令，输出与 3.13 逐行一致。
      # 但 3.8 已 EOL，不对外承诺支持，所以声称与 CI 都停在 3.9。
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt

      - name: 校验器自检
        run: python validator/validate.py --self-test

      - name: samples 必须干净通过（退出码 0）
        run: python validator/validate.py ./samples

      # ⚠️ 这一条必须反转判断：samples-broken 的**正确行为是退出码 1**。
      # 直接写 `run: python validator/validate.py ./samples-broken` 会让 CI 永远红，
      # 而且看起来像"代码坏了"，实际是断言写反了。
      - name: samples-broken 必须命中靶子（退出码 1）
        run: |
          if python validator/validate.py ./samples-broken; then
            echo "::error::samples-broken 竟然通过了——靶子失效"
            exit 1
          fi

      - name: 待填清单恒为退出码 0
        run: python validator/validate.py ./samples --todo
