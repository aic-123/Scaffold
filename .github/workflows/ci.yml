#
# 本文件守的正是 README 里那句核心声称：
#   「干净目录退出码 0，规则靶子目录退出码 1」
# 这句话若没有机器在守，就只是一句文档。

name: validator

on:
  push:
  pull_request:

jobs:
  validator:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # 最低 Python 版本由 CI 实测确定，README 不凭猜填写下限。
      # 若 3.9 挂了，说明下限更高——跑绿之后再把 README 的"Python 3"改成具体数字。
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt

      - name: 校验器自检
        run: python validator/validate.py --self-test

      - name: samples 必须干净通过（退出码 0）
        run: python validator/validate.py ./samples

      # ⚠️ 这一条必须反转判断：samples-broken 的**正确行为是退出码 1**。
      # 直接写 `run: python validator/validate.py ./samples-broken` 会让 CI 永远红，
      # 而且看起来像"代码坏了"，实际是断言写反了。
      - name: samples-broken 必须命中靶子（退出码 1）
        run: |
          if python validator/validate.py ./samples-broken; then
            echo "::error::samples-broken 竟然通过了——靶子失效"
            exit 1
          fi

      - name: 待填清单恒为退出码 0
        run: python validator/validate.py ./samples --todo
